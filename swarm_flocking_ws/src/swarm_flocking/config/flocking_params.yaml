# config/flocking_params.yaml
# Tunable parameters for the swarm flocking simulation.
# All BoidNode and FlockMonitorNode instances load this file.
#
# Tuning guide:
#   w_separation: Raise if robots collide. Typical range: 1.0 – 3.0
#   w_alignment:  Raise for tighter heading synchronization. Range: 0.5 – 2.0
#   w_cohesion:   Raise to keep flock more compact. Range: 0.5 – 2.0
#   w_obstacle:   Critical for safe navigation. Keep > separation. Range: 2.0 – 5.0
#   w_migration:  Gentle global pull. Too high makes flock ignore obstacles. Range: 0.1 – 0.8
#   neighbor_radius: Larger = more cooperative but more CPU. Range: 2.0 – 5.0
#   separation_radius: Should be > robot_diameter (0.178m for TurtleBot3 Burger)

/**:
  ros__parameters:
    # Total robots in the swarm (override per-node via launch)
    num_robots: 6

    # ─── Reynolds Force Weights ───────────────────────────────────────────────
    w_separation: 1.0     # Prevent collisions without over-dispersing at spawn
    w_alignment:  1.4     # Strong heading synchronization
    w_cohesion:   1.6     # Keep flock compact without over-compressing at walls
    w_obstacle:   3.2     # Strong obstacle avoidance without freezing at bottlenecks
    w_migration:  0.68    # Stronger waypoint pull for faster progress

    # ─── Sensing Ranges (meters) ──────────────────────────────────────────────
    neighbor_radius:    4.5   # Improve group connectivity in larger spread
    separation_radius:  0.5   # Avoid strong initial repulsion at spawn spacing
    obstacle_threshold: 0.9   # Early wall detection with less overreaction

    # ─── Motion Limits ────────────────────────────────────────────────────────
    max_linear_vel:  0.22     # m/s (faster traversal)
    max_angular_vel: 2.4      # rad/s
    lpf_alpha: 0.55           # Faster command response
    waypoint_arrival_radius: 1.2
    stop_on_goal_reached: true

    # ─── Adaptive Control Bounds ──────────────────────────────────────────────
    k_sep: 0.35
    min_sep_w: 0.7
    max_sep_w: 1.8
    alpha_coh: 0.45
    min_coh_w: 1.0
    max_coh_w: 3.2
    ideal_separation: 0.7
    threshold_spread: 0.9
    min_obs_w: 1.2
    max_obs_w: 5.8
    laser_epsilon: 0.01

    # ─── Regroup + Front-Obstacle Speed Control ─────────────────────────────
    regroup_spread_threshold: 1.4
    regroup_gain: 0.8
    max_regroup_w: 2.0
    front_slowdown_distance: 0.9
    min_front_speed_scale: 0.20
    front_fov_deg: 80.0
    front_stop_distance: 0.28
    escape_turn_rate: 2.3
    wall_follow_gain: 1.1
    wall_follow_max_w: 1.6
    goal_projection_min: 0.45
    goal_projection_gain: 1.2
    goal_projection_max_boost: 1.4
    goal_projection_obs_relax: 0.85
    waypoint_sync_fraction: 0.0
    waypoint_sync_radius_scale: 1.6

    # ─── Experiment Management (flock_monitor_node) ─────────────────────────
    monitor_rate_hz: 2.0
    rolling_window_s: 10.0
    goal_tolerance: 1.2
    success_timeout_s: 300.0
    success_max_collision_rate: 0.20
    success_max_mean_cohesion: 3.5
    auto_shutdown_on_completion: true
    csv_filename: experiment_results.csv
    log_interval_s: 5.0

    # ─── Waypoints (flat list: x0, y0, x1, y1, ...) ──────────────────────────
    # Matches the obstacle_course.world layout:
    #   Start zone → through bottleneck → open field → goal zone
    waypoints:
      - 8.0    # WP0 x — approach bottleneck
      - 7.5    # WP0 y
      - 15.0   # WP1 x — cross open field
      - 7.5    # WP1 y
      - 22.0   # WP2 x — enter maze section
      - 7.5    # WP2 y
      - 28.0   # WP3 x — reach goal zone
      - 7.5    # WP3 y
