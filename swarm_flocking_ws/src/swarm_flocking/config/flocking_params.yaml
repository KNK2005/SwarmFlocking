# config/flocking_params.yaml
# Tunable parameters for the swarm flocking simulation.
# All BoidNode and FlockMonitorNode instances load this file.
#
# Tuning guide:
#   w_separation: Raise if robots collide. Typical range: 1.0 – 3.0
#   w_alignment:  Raise for tighter heading synchronization. Range: 0.5 – 2.0
#   w_cohesion:   Raise to keep flock more compact. Range: 0.5 – 2.0
#   w_obstacle:   Critical for safe navigation. Keep > separation. Range: 2.0 – 5.0
#   w_migration:  Gentle global pull. Too high makes flock ignore obstacles. Range: 0.1 – 0.8
#   neighbor_radius: Larger = more cooperative but more CPU. Range: 2.0 – 5.0
#   separation_radius: Should be > robot_diameter (0.178m for TurtleBot3 Burger)

/**:
  ros__parameters:
    # Total robots in the swarm (override per-node via launch)
    num_robots: 6

    # ─── Reynolds Force Weights ───────────────────────────────────────────────
    w_separation: 1.0     # Prevent collisions without over-dispersing at spawn
    w_alignment:  1.4     # Strong heading synchronization
    w_cohesion:   1.6     # Keep flock compact without over-compressing at walls
    w_obstacle:   3.2     # Strong obstacle avoidance without freezing at bottlenecks
    w_migration:  0.68    # Stronger waypoint pull for faster progress

    # ─── Sensing Ranges (meters) ──────────────────────────────────────────────
    neighbor_radius:    4.5   # Improve group connectivity in larger spread
    separation_radius:  0.5   # Avoid strong initial repulsion at spawn spacing
    obstacle_threshold: 0.9   # Early wall detection with less overreaction

    # ─── Motion Limits ────────────────────────────────────────────────────────
    max_linear_vel:  0.22     # m/s (faster traversal)
    max_angular_vel: 2.4      # rad/s
    lpf_alpha: 0.55           # Faster command response
    waypoint_arrival_radius: 0.9
    stop_on_goal_reached: true

    # ─── Adaptive Control Bounds ──────────────────────────────────────────────
    k_sep: 0.35
    min_sep_w: 0.7
    max_sep_w: 1.8
    alpha_coh: 0.45
    min_coh_w: 1.0
    max_coh_w: 3.2
    ideal_separation: 0.7
    threshold_spread: 0.9
    min_obs_w: 1.2
    max_obs_w: 5.8
    laser_epsilon: 0.01

    # ─── Regroup + Front-Obstacle Speed Control ─────────────────────────────
    regroup_spread_threshold: 1.4
    regroup_gain: 0.8
    max_regroup_w: 2.0
    front_slowdown_distance: 0.9
    min_front_speed_scale: 0.20
    front_fov_deg: 80.0
    front_stop_distance: 0.28
    escape_turn_rate: 2.3
    wall_follow_gain: 1.1
    wall_follow_max_w: 1.6
    stuck_front_time_s: 0.9
    stuck_speed_threshold: 0.03
    recover_reverse_speed: 0.07
    recover_turn_rate: 2.3
    recover_duration_s: 1.0
    goal_projection_min: 0.45
    goal_projection_gain: 1.2
    goal_projection_max_boost: 1.4
    goal_projection_obs_relax: 0.85
    waypoint_sync_fraction: 0.30
    waypoint_sync_radius_scale: 1.6
    waypoint_bottleneck_guard_enable: true
    waypoint_bottleneck_guard_margin: 0.25
    waypoint_guard_window_x: 1.2
    sync_enable: true
    sync_leader_id: 2
    sync_columns: 3
    sync_spacing_x: 0.8
    sync_spacing_y: 0.55
    sync_position_gain: 1.15
    sync_velocity_gain: 0.5
    sync_max_w: 2.0
    sync_obstacle_relax: 0.9
    sync_error_boost_gain: 0.6
    sync_error_boost_max: 1.8
    bottleneck_mode_enable: true
    bottleneck_center_x: 8.5
    bottleneck_center_y: 7.5
    bottleneck_zone_half_x: 3.2
    bottleneck_zone_half_y: 4.0
    bottleneck_sync_columns: 1
    bottleneck_sync_spacing_x: 0.65
    bottleneck_sync_spacing_y: 0.18
    bottleneck_sync_gain_mult: 1.8
    bottleneck_sep_scale: 0.75
    bottleneck_migration_boost: 1.15
    neighbour_front_angle_deg: 20.0
    neighbour_as_obstacle_distance: 1.3
    neighbour_body_clearance: 0.30
    neighbour_scan_match_tol: 0.35
    neighbour_obstacle_scale: 0.05
    startup_relax_s: 6.0
    progress_timeout_s: 5.0
    progress_min_delta: 0.08
    desync_duration_s: 2.0
    desync_sync_scale: 0.25
    desync_migration_boost: 1.4
    stall_escalation_gain: 0.25
    desync_log_cooldown_s: 20.0
    use_monitor_waypoint: false
    context_bottleneck_min_scan: 0.55
    context_weight_lpf_alpha: 0.05
    force_floor_min_mag: 0.16
    force_floor_boost: 0.60

    # ─── Experiment Management (flock_monitor_node) ─────────────────────────
    monitor_rate_hz: 2.0
    rolling_window_s: 10.0
    goal_tolerance: 1.2
    waypoint_reach_radius: 1.5
    waypoint_reach_fraction: 0.67
    waypoint_bottleneck_guard_enable: true
    waypoint_bottleneck_guard_margin: 0.25
    waypoint_guard_window_x: 1.2
    bottleneck_center_x: 8.5
    split_recovery_trigger_s: 3.0
    split_recovery_duration_s: 5.0
    emergency_w_cohesion: 4.0
    emergency_w_migration: 0.2
    default_w_cohesion_restore: 1.6
    default_w_migration_restore: 0.68
    success_timeout_s: 600.0
    timeout_progress_grace_s: 180.0
    success_max_collision_rate: 0.20
    success_max_mean_cohesion: 3.5
    auto_shutdown_on_completion: true
    csv_filename: experiment_results.csv
    log_interval_s: 5.0

    # ─── Waypoints (flat list: x0, y0, x1, y1, ...) ──────────────────────────
    # Hardcoded obstacle-course path:
    #   Start gather -> bottleneck gap -> open-field lane -> around maze walls -> goal.
    waypoints:
      - 5.5    # WP0: leave spawn cluster toward center lane
      - 6.0
      - 7.6    # WP1: align with bottleneck entrance
      - 7.3
      - 9.2    # WP2: clear bottleneck wall at x=8.5
      - 7.5
      - 13.5   # WP3: open-field transit (above divider gap)
      - 7.5
      - 18.5   # WP4: approach maze
      - 7.5
      - 22.0   # WP5: begin north bypass around center maze wall
      - 8.8
      - 23.7   # WP6: pass above maze_v1 (y > 9.5 corridor)
      - 9.8
      - 25.4   # WP7: continue between h2/h3 constraints
      - 9.8
      - 27.6   # WP8: descend after maze exit funnel
      - 8.6
      - 28.0   # WP9: goal zone center
      - 7.5
